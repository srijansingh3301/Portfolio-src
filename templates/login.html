<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .login-wrap {
    max-width: 380px;
    margin: 0 auto;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .login-card h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .login-sub { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 28px; }
  .login-card .btn { width: 100%; margin-top: 8px; }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 24px;
    color: var(--text-muted);
    font-size: 0.9rem;
    text-decoration: none;
  }
  .back-link:hover { color: var(--text-strong); }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card page">
    <h1>Admin login</h1>
    <p class="login-sub">Sign in to manage thoughts and photos.</p>

    {% if error %}<p class="error-msg">{{ error }}</p>{% endif %}

    <form method="POST" action="/login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>

    <a class="back-link" href="/">&larr; Back to site</a>
  </div>
</div>
</body>
</html>
